/* ===== BlooBZ glass theme (no blur: translucent gradients only) ===== */
:root{--bg:#0B0B0B;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.05);--line:rgba(255,255,255,.14);--acc:#FFFFFF;--acc2:#FFFFFF;--mut:#D9D9D9;
--gl:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03));--edge:rgba(255,255,255,.16);--hot:rgba(255,255,255,.95)}
html,body{background:#0B0B0B}
#bgslot{position:fixed;inset:0;z-index:0;background:#0B0B0B;overflow:hidden}
#bgslot img,#bgslot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bgslot:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,2,3,.25),rgba(5,2,3,.55))}
#app{position:relative;z-index:1;background:none}
#view{padding-bottom:112px}
#nav{left:14px;right:14px;bottom:14px;height:66px;border-radius:30px;border:1px solid var(--edge);background:linear-gradient(135deg,rgba(26,26,26,.97),rgba(14,6,9,.98));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 24px rgba(0,0,0,.45)}
.ni{color:#D9D9D9;position:relative;transition:color .2s}
.ni.on{color:#FFFFFF}.ni.on svg{filter:drop-shadow(0 0 5px rgba(255,255,255,.8))}
.ni.on:not(.ctr):after{content:"";position:absolute;bottom:2px;width:20px;height:3px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.ni.ctr{flex:0 0 58px;height:58px;margin-top:-26px;border-radius:50%;justify-content:center;background:var(--gl),#0B0B0B;border:1px solid var(--edge);color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 16px rgba(0,0,0,.5)}

/* ================= BlooBZ design system v4 =================
   Principles: one accent (yellow, primary action only), neutral surfaces instead of outlines,
   4 type sizes, 16px gutters, 12/16 radii, zero shadows, only transform/opacity motion,
   nothing animates at rest. */
:root{
  --bg:#0B0B0B;--s1:#1A1A1A;--s2:#333333;--s3:#333333;--line:rgba(255,255,255,.06);
  --tx:#FFFFFF;--tx2:#D9D9D9;--mut:#6B6B6B;--dim:#6B6B6B;
  --acc:#FFFFFF;--acc2:#FFFFFF;--hot:#FFFFFF;--gold:#FFFFFF;--red:#FFFFFF;
  --edge:transparent;--gl:none;--rim:none;--ease:cubic-bezier(.2,.8,.2,1);
  --r12:12px;--r16:16px;--gut:16px
}
*{box-shadow:none!important}
html,body,#app{background:#0B0B0B!important}
body{font-family:'Inter',Roboto,system-ui,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;color:var(--tx)}
#bgslot{display:none!important}
#view{padding-bottom:84px;position:relative}
.hrow,.chips{scroll-snap-type:none!important;overscroll-behavior-x:contain}
.sk{animation:none!important;background:var(--s2)!important}
.bt{will-change:auto!important}
@keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes dotk{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* press feedback: the only interaction motion on content */
.card,.ep,.btn,.chip,.row2,.ib,.dl,.rqi,.acts2 button{transition:transform .12s var(--ease),background-color .18s}
.card:active,.ep:active,.btn:active,.chip:active,.row2:active,.dl:active{transform:scale(.97)}
.tp{animation:none!important;transform:scale(.97)}
/* touch dot: tap only, no glow, compositor-only */
.tapdot{position:fixed;z-index:9999;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--g) 0 45%,transparent 70%);animation:dotk .42s ease-out forwards;will-change:transform,opacity}
/* skip off-screen work while scrolling */
.hrow{content-visibility:auto;contain-intrinsic-size:auto 250px}
.grid>.card{content-visibility:auto;contain-intrinsic-size:auto 250px}
.eps>.ep{content-visibility:auto;contain-intrinsic-size:auto 80px}

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var CFG={bmc:'',bkash:'',nagad:'',rate:125};   /* fill in later: Buy Me a Coffee page link, bKash and Nagad numbers */
  var KEY='bzdash',st={adsToday:0,ads:0,adsGoal:3,donated:0,planEnd:0,top:{donated:[],ads:[]},day:'',pend:[]};
  try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){for(var k in sv)st[k]=sv[k]}}catch(e){}
  var today=new Date().toISOString().slice(0,10);if(st.day!==today){st.day=today;st.adsToday=0}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
  var DAY=864e5,tm=null;
  var AMT=[[1,'7 days'],[3,'30 days'],[5,'60 days']];
  var pick=3,method='bmc',txid='',pend=null;
  function open(full){$('pz').className='on'+(full?' full':'')}
  function close(){clearInterval(tm);$('pz').className='';$('pzs').innerHTML=''}
  function refresh(){var t=document.querySelector('[data-tab=profile]');if(t)t.click()}
  function leftTxt(){if(st.planEnd<=Date.now())return '';var h=Math.ceil((st.planEnd-Date.now())/36e5);return h<48?h+'h':Math.ceil(h/24)+' days'}
  function mark(){return ''}
  /* ---- watch ad ---- */
  function adSheet(){
    var done=st.adsToday>=st.adsGoal,l=leftTxt();
    $('pzs').innerHTML='<h3>Chat pass</h3><p>Watch a short ad to unlock chatting and commenting for 24 hours. Reading comments is always free.</p>'
     +'<div class="pzu">Today: <b>'+st.adsToday+' of '+st.adsGoal+'</b> ads watched'+(l?' &middot; pass active, '+l+' left':'')+'</div>'
     +(done?'<p>You used all '+st.adsGoal+' ads for today. Come back tomorrow, or donate for a longer pass.</p>':'')
     +'<button class="pzp pzw" id="pzgo"'+(done?' disabled':'')+'>'+(done?'Come back tomorrow':'Watch ad')+'</button><button class="pzc" id="pzx">Not now</button>'+mark();
    $('pzx').onclick=close;if(!done)$('pzgo').onclick=adPlay;open();
  }
  function adPlay(){
    var n=5;$('pzs').innerHTML='<h3>Ad</h3><div class="pzad">Ad placeholder: the real ad is connected later</div><div class="pzbar"><i id="pzi"></i></div><p id="pzl">Reward in '+n+'s</p><button class="pzc" id="pzcl" style="display:none">Close ad (no reward)</button>';
    open(true);setTimeout(function(){var i=$('pzi');if(i)i.style.width='100%';i&&(i.style.transition='width '+n+'s linear')},30);
    setTimeout(function(){var c=$('pzcl');if(c){c.style.display='block';c.onclick=function(){clearInterval(tm);adFail()}}},2000);
    tm=setInterval(function(){n--;if(n>0){var l=$('pzl');if(l)l.textContent='Reward in '+n+'s'}else{clearInterval(tm);adDone()}},1000);
  }
  function adFail(){$('pzs').innerHTML='<h3>Ad not completed</h3><p>The ad was closed before the end, so no reward was given. Try again.</p><button class="pzp pzw" id="pzgo">Try again</button><button class="pzc" id="pzx">Not now</button>';$('pzx').onclick=close;$('pzgo').onclick=adPlay;open();$('pz').className='on'}
  function adDone(){
    st.adsToday++;st.ads++;st.planEnd=Math.max(Date.now(),st.planEnd)+DAY;save();
    $('pzs').innerHTML='<div class="pzok">&#10003;</div><h3>Chat pass active</h3><p>You can chat and comment for the next 24 hours. Ads today: '+st.adsToday+' of '+st.adsGoal+'.</p><button class="pzp pzw" id="pzx">Done</button>';
    $('pz').className='on';$('pzx').onclick=function(){close();refresh()};
  }
  /* ---- donate ---- */
  function usd(){return pick}
  function reward(){for(var i=0;i<AMT.length;i++)if(AMT[i][0]===pick)return AMT[i][1];return pick>=5?'60 days':'30 days'}
  function dSheet(){
    var h='<h3>Donate</h3><p>Donations keep BlooBZ running. A donation also gives you a longer Chat pass.</p><div class="pzr" id="pza">';
    AMT.forEach(function(a){h+='<button class="pzo'+(pick===a[0]?' on':'')+'" data-a="'+a[0]+'">$'+a[0]+'<small style="display:block;font-weight:400;color:#a6a6ad;font-size:11px">'+a[1]+'</small></button>'});
    h+='</div><div class="pzu">You get <b>'+reward()+'</b> of Chat pass and a place on the Top 10 board.</div>';
    h+='<button class="pzb'+(method==='bmc'?' on':'')+'" data-m="bmc">Card or crypto<small>Opens secure checkout inside the app</small></button>';
    h+='<button class="pzb'+(method==='bkash'?' on':'')+'" data-m="bkash">bKash<small>Send money, then enter the transaction ID</small></button>';
    h+='<button class="pzb'+(method==='nagad'?' on':'')+'" data-m="nagad">Nagad<small>Send money, then enter the transaction ID</small></button>';
    var okm=!!CFG[method];if(!okm)h+='<p style="margin:0 0 10px;color:#f5c518">This option is not available yet.</p>';h+='<button class="pzp pzw" id="pzgo"'+(okm?'':' disabled')+'>Continue with $'+pick+'</button><button class="pzc" id="pzx">Cancel</button>'+mark();
    $('pzs').innerHTML=h;open();$('pzx').onclick=close;
    $('pza').onclick=function(e){var b=e.target.closest('button');if(b){pick=+b.getAttribute('data-a');dSheet()}};
    $('pzs').onclick=function(e){var b=e.target.closest&&e.target.closest('[data-m]');if(b){method=b.getAttribute('data-m');dSheet()}};
    $('pzgo').onclick=function(){method==='bmc'?bmc():manual()};
  }
  function bmc(){
    $('pzs').innerHTML='<h3>Card or crypto</h3><div class="pzn">'+CFG.bmc.replace(/^https?:\/\//,'')+'<b>$'+pick+'</b></div><p>This page opens inside the app. Add your BlooBZ username in the message box so we can find your donation.</p>'
     +'<input id="pzu" placeholder="Your BlooBZ username" value="">'
     +'<div class="pzr"><button class="pzo on">Card</button><button class="pzo">Crypto</button></div>'
     +'<button class="pzp pzw" id="pzgo">Pay $'+pick+'</button><button class="pzc" id="pzx">Back</button>'+mark();
    open(true);$('pzx').onclick=dSheet;$('pzgo').onclick=function(){txid=($('pzu').value||'you');pending('Card or crypto')};
  }
  function manual(){
    var nm=method==='bkash'?'bKash':'Nagad',bdt=Math.round(pick*CFG.rate);
    $('pzs').innerHTML='<h3>Pay with '+nm+'</h3><p>1. Open your '+nm+' app and choose Send Money.<br>2. Send about <b style="color:#fff">'+bdt+' BDT</b> ($'+pick+') to the number below.<br>3. Enter the transaction ID here.</p>'
     +'<div class="pzn">'+nm+' personal number<b>'+CFG[method]+'</b></div>'
     +'<input id="pzt" placeholder="Transaction ID" autocomplete="off">'
     +'<button class="pzp pzw" id="pzgo">I have paid</button><button class="pzc" id="pzx">Back</button>'+mark();
    open();$('pzx').onclick=dSheet;$('pzgo').onclick=function(){var v=($('pzt').value||'').trim();if(!v){$('pzt').style.borderColor='#e5383b';$('pzt').placeholder='Enter the transaction ID';return}txid=v;pending(nm)};
  }
  function pending(nm){
    pend={amt:pick,days:reward(),via:nm};st.pend.push({amt:pick,via:nm,ref:txid,at:Date.now()});save();
    $('pzs').innerHTML='<div class="pzok" style="background:#3a2f12;color:#f5c518">&#8987;</div><h3>Donation pending</h3><p>Thank you. We check each donation by hand, usually within a few hours. Your Chat pass starts as soon as it is approved, and you will get a notification.</p><div class="pzu">'+nm+' &middot; $'+pend.amt+' &middot; reference: '+esc(txid)+'</div>'
     +'<button class="pzp pzw" id="pzx">Done</button>';
    $('pz').className='on';$('pzx').onclick=close;
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function approve_unused(){
    var d=pend.days==='7 days'?7:pend.days==='60 days'?60:30;
    st.planEnd=Math.max(Date.now(),st.planEnd)+d*DAY;st.donated+=pend.amt;st.top.donated=[['You',st.donated]];
    $('pzs').innerHTML='<div class="pzok">&#10003;</div><h3>Donation approved</h3><p>Thank you for supporting BlooBZ. Your Chat pass is active for '+pend.days+', and you are on the Top 10 board.</p><button class="pzp pzw" id="pzx">Done</button>';
    $('pz').className='on';$('pzx').onclick=function(){close();refresh()};
  }
  window.BlooBZDash={load:function(){return JSON.parse(JSON.stringify(st))},watchAd:adSheet,donate:dSheet};
  $('pz').addEventListener('click',function(e){if(e.target===this&&this.className.indexOf('full')<0)close()});
})();
</script>
